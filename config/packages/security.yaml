security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # ------------------------
    # User providers
    # ------------------------
    providers:
        # Use your User entity for authentication
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ------------------------
    # Firewalls
    # ------------------------
    firewalls:
        # Disable security for dev tools and assets
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Disable security for API docs
        api_docs:
            pattern: ^/api/docs
            security: false

        # Optional: Login API (if you want JSON login for API)
        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure


        # API firewall using JWT / stateless
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # Admin firewall
        admin:
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: app_login            # route for login form
                check_path: app_login            # route to submit login
                default_target_path: /admin      # redirect after login
            logout:
                path: /admin/logout                 # route to logout
                target: /admin/login             # redirect after logout

#            access_denied_handler: App\Security\AdminAccessDeniedHandler
            access_denied_url: /access-denied



    # ------------------------
    # Access Control
    # ------------------------
    access_control:
        # API
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/quizzes, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # Admin
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }   # login page must be public
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_SUPER_ADMIN] }           # everything else requires admin
