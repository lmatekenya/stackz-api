api_platform:
    title: StackZ API
    description: Backend API for StackZ Quiz Application
    version: 1.0.0
    mapping:
        paths: ['%kernel.project_dir%/src/Entity']
    patch_formats:
        json: ['application/merge-patch+json']
    swagger:
        versions: [3]
    collection:
        pagination:
            enabled: true
            items_per_page_parameter_name: itemsPerPage
            page_parameter_name: page
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
